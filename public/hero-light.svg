<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-light" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e1e4e8" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-light">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="150" fill="#ffffff" />
  <rect width="800" height="150" fill="url(#grid-light)" />

  <g stroke="#2da44e" stroke-width="1" fill="none" opacity="0.8">
    <path d="M -50 75 L 150 75 L 250 40 L 400 40 L 500 90 L 650 90 L 850 75" />
    <path d="M 150 75 L 250 110 L 400 110 L 500 90" stroke="#0969da" opacity="0.7"/>
    <path d="M 400 40 L 400 110" stroke="#8b949e" stroke-dasharray="2,4" opacity="0.6"/>
  </g>

  <g fill="#ffffff" stroke="#2da44e" stroke-width="1.5">
    <circle cx="150" cy="75" r="4" />
    <circle cx="250" cy="40" r="4" />
    <circle cx="400" cy="40" r="4.5" />
    <circle cx="500" cy="90" r="4" />
    <circle cx="650" cy="90" r="4" />
    <circle cx="250" cy="110" r="3" stroke="#0969da" />
    <circle cx="400" cy="110" r="3" stroke="#0969da" />
  </g>

  <circle cx="-50" cy="75" r="2" fill="#2da44e" filter="url(#glow-light)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 0 0 L 200 0 L 300 -35 L 450 -35 L 550 15 L 700 15 L 900 0" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="75" r="1.5" fill="#0969da" filter="url(#glow-light)">
    <animateMotion dur="10s" repeatCount="indefinite" begin="2s" path="M 0 0 L 100 35 L 250 35 L 350 15" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
